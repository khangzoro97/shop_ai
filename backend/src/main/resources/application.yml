spring:
  application:
    name: fortfio
  config:
    # Local secrets such as FAL_KEY=... (git-ignored); real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    # Local development: `docker compose up -d postgres` from the project root.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fortfio}
    username: ${DB_USERNAME:fortfio}
    password: ${DB_PASSWORD:fortfio}
  jpa:
    hibernate:
      # Schema changes go through Flyway migrations in db/migration.
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8088}
  tomcat:
    max-http-form-post-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentry:
  # Error monitoring is off while SENTRY_DSN is empty.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  send-default-pii: false

fortfio:
  cors:
    allowed-origins: http://localhost:5173
  signup-credits: 30
  job-timeout: 15m
  storage:
    # local: files on this server's disk, served under /files. s3: Cloudflare R2 or Amazon S3.
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:./storage}
    # local: /files. s3: the bucket's public URL, e.g. https://media.example.com
    public-base-url: ${STORAGE_PUBLIC_URL:/files}
    s3:
      # R2: https://<account-id>.r2.cloudflarestorage.com (region "auto"). Leave empty for Amazon S3.
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  fal:
    # Leave empty to run with the mock provider (no API cost).
    api-key: ${FAL_KEY:}
    queue-url: https://queue.fal.run
    background-removal-model: fal-ai/birefnet/v2
    backdrop-model: fal-ai/flux/dev
    models:
      PRODUCT_PHOTO: fal-ai/nano-banana/edit
      VIRTUAL_TRYON: fal-ai/kling/v1-5/kolors-virtual-try-on
      PRODUCT_VIDEO: fal-ai/kling-video/v2.1/standard/image-to-video
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 7d
    otp:
      ttl: 5m
      resend-cooldown: 60s
      max-attempts: 5
      expose-code: true
  rate-limit:
    generations-per-minute: 6
    auth-per-minute: 10
    otp-per-hour: 5
  uploads:
    max-image-size: 6MB
    max-request-size: 20MB
    # AI results (videos included) copied into our storage.
    max-download-size: 150MB
    allowed-remote-hosts:
      - fal.media
      - "*.fal.media"
  admin:
    # Creates (or promotes) this account as ADMIN on startup.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod

server:
  forward-headers-strategy: framework

sentry:
  environment: ${SENTRY_ENVIRONMENT:production}

fortfio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    # Required in production: at least 32 random characters.
    jwt-secret: ${JWT_SECRET}
    otp:
      expose-code: false
