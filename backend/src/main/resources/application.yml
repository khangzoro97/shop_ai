spring:
  application:
    name: fortfio
  datasource:
    url: jdbc:h2:mem:fortfio;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # Only for local debugging: H2_CONSOLE=true
      enabled: ${H2_CONSOLE:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8088}
  tomcat:
    max-http-form-post-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fortfio:
  cors:
    allowed-origins: http://localhost:5173
  signup-credits: 30
  job-timeout: 15m
  storage:
    local-dir: ${STORAGE_DIR:./storage}
    public-base-url: ${STORAGE_PUBLIC_URL:/files}
  fal:
    # Leave empty to run with the mock provider (no API cost).
    api-key: ${FAL_KEY:}
    queue-url: https://queue.fal.run
    background-removal-model: fal-ai/birefnet/v2
    backdrop-model: fal-ai/flux/dev
    models:
      PRODUCT_PHOTO: fal-ai/nano-banana/edit
      VIRTUAL_TRYON: fal-ai/kling/v1-5/kolors-virtual-try-on
      PRODUCT_VIDEO: fal-ai/kling-video/v2.1/standard/image-to-video
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 7d
    otp:
      ttl: 5m
      resend-cooldown: 60s
      max-attempts: 5
      expose-code: true
  rate-limit:
    generations-per-minute: 6
    auth-per-minute: 10
    otp-per-hour: 5
  uploads:
    max-image-size: 6MB
    max-request-size: 20MB
    allowed-remote-hosts: fal.media, "*.fal.media"
  admin:
    # Creates (or promotes) this account as ADMIN on startup.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fortfio}
    username: ${DB_USERNAME:fortfio}
    password: ${DB_PASSWORD:fortfio}
  h2:
    console:
      enabled: false

server:
  forward-headers-strategy: framework

fortfio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    # Required in production: at least 32 random characters.
    jwt-secret: ${JWT_SECRET}
    otp:
      expose-code: false
