# Tests run against a real PostgreSQL started by Testcontainers (Docker required),
# shared by every test context in the JVM.
spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///fortfio?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

fortfio:
  fal:
    # Never call the paid API from tests, even when backend/.env holds a real key.
    api-key: ""
  auth:
    google-client-id: ""
  mail:
    host: ""
